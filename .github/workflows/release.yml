name: release

# Production runs immutable images pinned by digest, so a release publishes
# artifacts here once instead of rebuilding them on the deployment host.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: Publish container images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A production tag must describe reviewed code. Without this a tag on an
      # unmerged branch would publish an image nobody reviewed.
      - name: Verify the tag is reachable from main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME does not point at a commit reachable from main."
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3

      - name: Log in to the registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The API image and its web front end come from the same Dockerfile but
      # different targets, so they are built as two images from one context.
      - name: Build and push the PHP-FPM image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          target: app
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sakala-api:${{ github.ref_name }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          target: web
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sakala-api-web:${{ github.ref_name }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api-web
          cache-to: type=gha,scope=api-web,mode=max

  github-release:
    name: Publish GitHub Release
    # Runs only after the image is published, so a Release never announces a
    # version whose image does not exist. The image job also refuses tags that
    # are not reachable from main. Only this job may write to the repository.
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The notes are this version's CHANGELOG section: everything between
      # "## [X.Y.Z]" and the next "## [" heading. A version tag without one is a
      # release prep mistake, so the job fails instead of publishing a Release
      # with only the generated list.
      - name: Extract the changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## [$version]" '
            index($0, "## [") == 1 { if (found) exit; found = (index($0, heading) == 1); next }
            found { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error file=CHANGELOG.md::No non-empty \"## [$version]\" section in CHANGELOG.md for tag $GITHUB_REF_NAME."
            exit 1
          fi
          cat "$notes"

      # GitHub appends its generated "What's Changed" list, which mentions every
      # contributor, below the changelog section.
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          # A tag such as v1.0.0-rc.1 is a prerelease and never becomes Latest.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
