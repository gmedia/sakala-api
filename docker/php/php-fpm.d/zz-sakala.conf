[global]
; The image stops PHP-FPM with SIGQUIT (STOPSIGNAL in the php image). PHP-FPM
; then closes its listening socket at once and lets each worker finish the
; request it is serving, but only for this long. The default of 0 kills those
; requests immediately. Keep it below the container's stop timeout
; (stop_grace_period: 30s in sakala-deployment's compose.yaml).
process_control_timeout = 25s
