server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Docker's DNS. A literal host in fastcgi_pass is resolved once at startup,
    # so recreating only the api container would leave a stale address and 502s
    # until nginx reloads. A variable makes nginx resolve it while running.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        set $upstream api:9000;
        fastcgi_pass $upstream;
    }

    location ~ /\. {
        deny all;
    }
}
