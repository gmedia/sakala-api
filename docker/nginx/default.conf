server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Docker's DNS. A literal host in fastcgi_pass is resolved once at startup,
    # so a replaced api container would leave a stale address. A variable makes
    # nginx resolve it while running, and it then uses every address `api` has:
    # a deploy briefly runs two api containers (start the new one, wait until
    # it is healthy, then stop the old one). `valid=1s` overrides the
    # 600-second TTL Docker's DNS hands out, so a new or removed container is
    # seen within a second.
    #
    # Not an `upstream` block with `server api:9000 resolve`: when its periodic
    # re-resolve changes the peer list while a request waits on a removed
    # container, nginx does not retry that request on the other one and
    # answers 504. Here each request keeps the addresses it resolved.
    resolver 127.0.0.11 valid=1s ipv6=off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        set $upstream api:9000;
        fastcgi_pass $upstream;

        # A stopping PHP-FPM refuses new connections at once (`error`), and a
        # removed container's address does not answer at all (`timeout`), so
        # nginx retries the other container. The default 60-second connect
        # timeout held such a request for that long; now it waits at most one
        # second, and only during the second after a container is removed.
        #
        # Connections already waiting in the stopping PHP-FPM's accept queue
        # are reset without PHP reading them. nginx has sent the request by
        # then, so without `non_idempotent` such a POST answered 502. In a
        # local replica under load, 7,504 POSTs with 18 such resets ran exactly
        # 7,504 times. The 2-second limit narrows the retry to failures early
        # in a request: a response that times out after 60 seconds is never
        # replayed. What remains is a worker that dies within 2 seconds of
        # receiving a POST while a second container exists, which happens only
        # during a deploy.
        fastcgi_connect_timeout 1s;
        fastcgi_next_upstream error timeout non_idempotent;
        fastcgi_next_upstream_timeout 2s;
    }

    location ~ /\. {
        deny all;
    }
}
